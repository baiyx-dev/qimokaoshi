    <nav class="nav-wrap">
      <a class="brand" href="index.html"><img src="img/logo.svg" alt="秦声陕艺 logo"></a>
      <button class="nav-toggle" type="button" aria-label="打开导航" aria-expanded="false">☰</button>
      <ul class="nav-list">

  </header>
  <main class="login-page">
    <form class="form-panel login-card" data-validate="login" novalidate>
      <h1>登录</h1>
      <p class="section-desc">开启你的秦声陕艺之旅。</p>
      <div class="field">
        <label for="account">账号</label>
        <input id="account" name="account" type="text" placeholder="账号">
        <span class="error" data-error="account"></span>
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" placeholder="不少于 6 位">
        <span class="error" data-error="password"></span>
      </div>
      <button class="btn" type="submit">登录</button>
      <p data-form-status></p>
    </form>
  </main>
  <script src="js/main.js?v=20260528d"></script>
